<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Export — empty spots check</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Inter:wght@400..700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position:relative; width:390px; height:844px; overflow:hidden; background:#0B0B0C; color:#FFFFFF; font-family:Inter, -apple-system, Roboto, sans-serif; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round">
<div style="position:absolute; left:0; top:0; width:390px; height:844px"><dc-import name="Ed" state="partial" hint="5/12 photos · tap a photo to edit it" hint-size="390px,844px"></dc-import></div>
<div style="position:absolute; left:0; top:0; width:390px; height:844px; background:rgba(0,0,0,.6)"></div>
<section role="dialog" aria-label="7 spots are still empty" style="position:absolute; left:0; top:480px; width:390px; height:364px; box-sizing:border-box; padding:0 20px; border-radius:24px 24px 0 0; background:#1C1C1E">
<div style="width:36px; height:5px; margin:8px auto 0; border-radius:3px; background:#48484A"></div>
<h2 style="margin:18px 0 0; font:700 22px/28px 'Bricolage Grotesque', Inter, sans-serif; letter-spacing:-0.3px">7 spots are still empty</h2>
<p style="margin:6px 0 0; font-size:14px; line-height:20px; color:#8E8E93">Empty spots save as plain paper. Fill them first, or save the 6 slides as they are.</p>
<div style="position:relative; margin-top:18px; height:72px">
<dc-import name="Diary" w="50" gap="8" count="6" state="partial" radius="4" hint-size="340px,63px"></dc-import>
<span aria-label="Slide 1: 1 empty" style="position:absolute; left:38px; top:-6px; width:20px; height:20px; border-radius:50%; background:#FF5A36; color:#16130F; font:700 11px/20px Inter, sans-serif; text-align:center">1</span>
<span aria-label="Slide 2: 1 empty" style="position:absolute; left:96px; top:-6px; width:20px; height:20px; border-radius:50%; background:#FF5A36; color:#16130F; font:700 11px/20px Inter, sans-serif; text-align:center">1</span>
<span aria-label="Slide 3: all filled" style="position:absolute; left:154px; top:-6px; width:20px; height:20px; border-radius:50%; background:#FFFFFF; color:#16130F; display:flex; align-items:center; justify-content:center"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:3"><path d="M20 6 9 17l-5-5"></path></svg></span>
<span aria-label="Slide 4: 1 empty" style="position:absolute; left:212px; top:-6px; width:20px; height:20px; border-radius:50%; background:#FF5A36; color:#16130F; font:700 11px/20px Inter, sans-serif; text-align:center">1</span>
<span aria-label="Slide 5: 3 empty" style="position:absolute; left:270px; top:-6px; width:20px; height:20px; border-radius:50%; background:#FF5A36; color:#16130F; font:700 11px/20px Inter, sans-serif; text-align:center">3</span>
<span aria-label="Slide 6: 1 empty" style="position:absolute; left:328px; top:-6px; width:20px; height:20px; border-radius:50%; background:#FF5A36; color:#16130F; font:700 11px/20px Inter, sans-serif; text-align:center">1</span>
</div>
<div style="display:flex; gap:10px; margin-top:22px">
<button type="button" style="flex:1; height:52px; border:0; border-radius:26px; background:#2C2C2E; color:#FFFFFF; font:600 15px Inter, sans-serif">Keep editing</button>
<button type="button" style="flex:1; height:52px; border:0; border-radius:26px; background:#FF5A36; color:#16130F; font:700 15px Inter, sans-serif">Save anyway</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
