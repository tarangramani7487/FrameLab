<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dialog — remove all photos?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Inter:wght@400..700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position:relative; width:390px; height:844px; overflow:hidden; background:#0B0B0C; color:#FFFFFF; font-family:Inter, -apple-system, Roboto, sans-serif">
<div style="position:absolute; left:0; top:0; width:390px; height:844px"><dc-import name="Ed" state="partial" hint="5/12 photos · tap a photo to edit it" hint-size="390px,844px"></dc-import></div>
<div style="position:absolute; left:0; top:0; width:390px; height:844px; background:rgba(0,0,0,.6)"></div>
<section role="alertdialog" aria-label="Remove all photos?" style="position:absolute; left:36px; top:316px; width:318px; box-sizing:border-box; padding:24px 20px 20px; border-radius:24px; background:#1C1C1E; box-shadow:0 20px 50px rgba(0,0,0,.5); text-align:center">
<h2 style="margin:0; font:700 20px/26px 'Bricolage Grotesque', Inter, sans-serif">Remove all photos?</h2>
<p style="margin:8px 0 0; font-size:14px; line-height:20px; color:#8E8E93">Locked photos stay. You can undo this.</p>
<div style="display:flex; gap:10px; margin-top:22px">
<button type="button" style="flex:1; height:48px; border:0; border-radius:24px; background:#2C2C2E; color:#FFFFFF; font:600 15px Inter, sans-serif">Cancel</button>
<button type="button" style="flex:1; height:48px; border:0; border-radius:24px; background:#C8372D; color:#FFFFFF; font:700 15px Inter, sans-serif">Remove</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
