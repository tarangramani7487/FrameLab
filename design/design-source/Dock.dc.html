<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editor dock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Inter:wght@400..700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position:relative; width:390px; height:80px; color:#FFFFFF; font-family:Inter, -apple-system, Roboto, sans-serif; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round">
<div role="toolbar" aria-label="Editor tools" style="position:absolute; left:12px; top:16px; width:366px; height:64px; box-sizing:border-box; padding:0 4px; border-radius:22px; background:#1C1C1E; border:1px solid rgba(255,255,255,.07); display:flex; align-items:center; gap:2px; box-shadow:0 8px 24px rgba(0,0,0,.35)">
<sc-if value="{{main}}" hint-placeholder-val="{{ true }}">
<button type="button" style="flex:1; min-width:0; height:56px; border:0; padding:0; border-radius:16px; background:transparent; color:#FFFFFF; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font:600 11px/14px Inter, sans-serif"><span style="width:32px; height:24px; border-radius:12px; background:#FF5A36; color:#16130F; display:flex; align-items:center; justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2.4"><path d="M12 5v14M5 12h14"></path></svg></span>Photos</button>
<button type="button" disabled="{{d.shuffle}}" style="flex:1; min-width:0; height:56px; border:0; padding:0; border-radius:16px; background:{{bg.shuffle}}; color:{{col.shuffle}}; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font:600 11px/14px Inter, sans-serif"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17h2.5c1.6 0 3-.8 3.9-2.1l4.2-6.3c.9-1.3 2.3-2.1 3.9-2.1H21"></path><path d="m18 3.5 3 3-3 3"></path><path d="M3 7h2.5c1.4 0 2.6.6 3.4 1.6"></path><path d="M21 17h-3.5c-1.4 0-2.7-.6-3.5-1.7"></path><path d="m18 14 3 3-3 3"></path></svg>Shuffle</button>
<button type="button" style="flex:1; min-width:0; height:56px; border:0; padding:0; border-radius:16px; background:{{bg.color}}; color:{{col.color}}; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font:600 11px/14px Inter, sans-serif"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5s-6 6.4-6 10.6a6 6 0 0 0 12 0c0-4.2-6-10.6-6-10.6z"></path></svg>Color</button>
<button type="button" style="flex:1; min-width:0; height:56px; border:0; padding:0; border-radius:16px; background:{{bg.order}}; color:{{col.order}}; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font:600 11px/14px Inter, sans-serif"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"></path><path d="M4 5h1.5v4"></path><path d="M4 9h3"></path><path d="M3.8 15.2a1.3 1.3 0 0 1 2.4.7c0 .9-2.4 1.9-2.4 3.1h2.6"></path></svg>Order</button>
<button type="button" disabled="{{d.clear}}" style="flex:1; min-width:0; height:56px; border:0; padding:0; border-radius:16px; background:{{bg.clear}}; color:{{col.clear}}; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font:600 11px/14px Inter, sans-serif"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-3.6-3.6a2 2 0 0 1 0-2.8l9.9-9.9a2 2 0 0 1 2.8 0l4.3 4.3a2 2 0 0 1 0 2.8L13 19.2"></path><path d="M21 21H7"></path><path d="m6.5 11.5 6 6"></path></svg>Clear</button>
</sc-if>
<sc-if value="{{sel}}" hint-placeholder-val="{{ false }}">
<button type="button" style="flex:1; min-width:0; height:56px; border:0; padding:0; border-radius:16px; background:{{bg.frame}}; color:{{col.frame}}; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font:600 11px/14px Inter, sans-serif"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v18M17 3v18M3 7h18M3 17h18"></path></svg>Frame</button>
<button type="button" disabled="{{d.position}}" style="flex:1; min-width:0; height:56px; border:0; padding:0; border-radius:16px; background:{{bg.position}}; color:{{col.position}}; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font:600 11px/14px Inter, sans-serif"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18"></path><path d="m9 6 3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"></path></svg>Position</button>
<button type="button" style="flex:1; min-width:0; height:56px; border:0; padding:0; border-radius:16px; background:{{bg.style}}; color:{{col.style}}; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font:600 11px/14px Inter, sans-serif"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"></path></svg>Style</button>
<button type="button" style="flex:1; min-width:0; height:56px; border:0; padding:0; border-radius:16px; background:{{bg.dup}}; color:{{col.dup}}; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font:600 11px/14px Inter, sans-serif"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5"></rect><path d="M15.5 8.5V6A2.5 2.5 0 0 0 13 3.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"></path></svg>Duplicate</button>
<button type="button" disabled="{{d.del}}" style="flex:1; min-width:0; height:56px; border:0; padding:0; border-radius:16px; background:{{bg.del}}; color:{{col.del}}; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font:600 11px/14px Inter, sans-serif"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"></path><path d="M9.5 7V4.5h5V7"></path><path d="M6 7l1 12.5A1.5 1.5 0 0 0 8.5 21h7a1.5 1.5 0 0 0 1.5-1.5L18 7"></path><path d="M10 11v6M14 11v6"></path></svg>Delete</button>
</sc-if>
</div>
<sc-if value="{{sel}}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="Deselect photo" style="position:absolute; right:8px; top:0; width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,.16); padding:0; background:#2C2C2E; color:#FFFFFF; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,.4)"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2.2"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["main","select"],"default":"main"},"active":{"editor":"enum","options":["none","color","order","frame","position","style"],"default":"none"},"empty":{"editor":"enum","options":["no","yes"],"default":"no"},"locked":{"editor":"enum","options":["no","yes"],"default":"no"},"$preview":{"width":390,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const mode = p.mode ?? 'main';
    const act = p.active ?? 'none';
    const empty = p.empty === 'yes';
    const locked = p.locked === 'yes';
    const off = { shuffle: empty, clear: empty, position: locked, del: locked };
    const d = {}, col = {}, bg = {};
    ['shuffle', 'color', 'order', 'clear', 'frame', 'position', 'style', 'dup', 'del'].forEach((k) => {
      const dis = !!off[k];
      const on = k === act;
      d[k] = dis;
      col[k] = dis ? '#5A5A5E' : (on ? '#FF5A36' : '#FFFFFF');
      bg[k] = on ? 'rgba(255,90,54,.10)' : 'transparent';
    });
    return { main: mode === 'main', sel: mode === 'select', d, col, bg };
  }
}
</script>
</body>
</html>
