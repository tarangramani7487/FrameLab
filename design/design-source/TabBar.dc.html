<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Inter:wght@400..700&display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="width:390px; height:88px; box-sizing:border-box; background:#FFFFFF; border-top:1px solid #ECE6DC; padding:6px 6px 24px; display:flex; font-family:Inter, -apple-system, Roboto, sans-serif; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round">
<a href="#" aria-current="{{cur.home}}" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; text-decoration:none; font-size:11px; line-height:14px; font-weight:{{fw.home}}; color:{{tc.home}}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="color:{{ic.home}}"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"></path></svg>Home</a>
<a href="#" aria-current="{{cur.explore}}" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; text-decoration:none; font-size:11px; line-height:14px; font-weight:{{fw.explore}}; color:{{tc.explore}}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="color:{{ic.explore}}"><circle cx="12" cy="12" r="8.5"></circle><path d="m15.4 8.6-2.1 4.7-4.7 2.1 2.1-4.7z"></path></svg>Explore</a>
<a href="#" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; text-decoration:none; font-size:11px; line-height:14px; font-weight:600; color:#16130F"><span style="width:52px; height:32px; border-radius:16px; background:#FF5A36; color:#16130F; display:flex; align-items:center; justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2.3"><path d="M12 5v14M5 12h14"></path></svg></span>Create</a>
<a href="#" aria-current="{{cur.designs}}" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; text-decoration:none; font-size:11px; line-height:14px; font-weight:{{fw.designs}}; color:{{tc.designs}}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="color:{{ic.designs}}"><rect x="3.5" y="7.5" width="13" height="13" rx="2.5"></rect><path d="M7.5 4h10a3 3 0 0 1 3 3v10"></path></svg>My Designs</a>
<a href="#" aria-current="{{cur.profile}}" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; text-decoration:none; font-size:11px; line-height:14px; font-weight:{{fw.profile}}; color:{{tc.profile}}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="color:{{ic.profile}}"><circle cx="12" cy="8.5" r="3.6"></circle><path d="M5 20c.8-3.6 3.6-5.6 7-5.6s6.2 2 7 5.6"></path></svg>Profile</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","explore","designs","profile"],"default":"home"},"$preview":{"width":390,"height":88}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const ic = {}, tc = {}, fw = {}, cur = {};
    ['home', 'explore', 'designs', 'profile'].forEach((k) => {
      const on = k === a;
      ic[k] = on ? '#FF5A36' : '#6F685E';
      tc[k] = on ? '#B33A17' : '#6F685E';
      fw[k] = on ? 700 : 500;
      cur[k] = on ? 'page' : 'false';
    });
    return { ic, tc, fw, cur };
  }
}
</script>
</body>
</html>
